name: SafeData checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Tests never use real LVM, SSH connections, or backup data.
      - name: Build and safe regression tests
        run: nix flake check --no-update-lock-file --option allow-import-from-derivation false --print-build-logs
      - name: Verify dependency lock file is unchanged
        run: git diff --exit-code -- flake.lock
