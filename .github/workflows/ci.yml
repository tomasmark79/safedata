name: Kontrola SafeData
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Testy nikdy nepoužívají skutečné LVM, SSH spojení ani zálohovaná data.
      - name: Sestavení a bezpečné regrese
        run: nix flake check --no-update-lock-file --option allow-import-from-derivation false --print-build-logs
      - name: Nezměněný zámek závislostí
        run: git diff --exit-code -- flake.lock
